apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: petstore-events
  namespace: argo-events
spec:
  eventBusName: default
  nats:
    petstore-event:
      url: nats://eventbus-default-stan-svc:4222
      jsonBody: true
      clusterID: "eventbus-default"
      subject: petstore.orders
      auth:
        token:
          name: nats-token
          key: token
