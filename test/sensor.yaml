apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: petstore-sensor
spec:
  template:
    spec:
      containers:
      - name: main
        imagePullPolicy: IfNotPresent
        #image: quay.io/argoproj/argo-events:v1.9.6
  dependencies:
    - name: test
      eventSourceName: petstore-events
      eventName: petstore-event
  triggers:
    - template:
        name: custom-petstore
        custom:
          serverURL: petstore:81
          spec:
            url: https://example.com
          parameters:
            - src:
                dependencyName: test
                dataKey: body.operationId
              dest: operationId
            - src:
                dependencyName: test
                dataKey: body.parameters
                useRawData: true
              dest: parameters
